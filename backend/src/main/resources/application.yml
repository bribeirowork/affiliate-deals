server:
  port: ${PORT:8080}

spring:
  application:
    name: vendas-platform

  datasource:
    url: jdbc:h2:mem:vendasdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  h2:
    console:
      enabled: false

  thymeleaf:
    cache: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
