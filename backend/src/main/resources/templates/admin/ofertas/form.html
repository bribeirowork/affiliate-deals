<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oferta - Backoffice</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: navbar('ofertas')}"></div>

<div class="admin-page">
    <div class="page-header">
        <h4 th:text="${oferta != null} ? 'Editar oferta' : 'Nova oferta'"></h4>
        <a th:href="@{/admin/ofertas}" class="btn btn--ghost">
            <i class="material-icons">arrow_back</i> Voltar
        </a>
    </div>

    <div class="admin-card">
        <form method="post" enctype="multipart/form-data"
              th:action="${oferta != null} ? @{/admin/ofertas/{id}(id=${oferta.id()})} : @{/admin/ofertas}">

            <div class="form-grid">

                <div class="form-group span-2">
                    <label for="nomeProduto">Nome do produto</label>
                    <input id="nomeProduto" type="text" name="nomeProduto"
                           th:value="${oferta?.nomeProduto()}"
                           placeholder="Ex: Fone Bluetooth XYZ"
                           required/>
                </div>

                <div class="form-group span-2">
                    <label for="imagemUrl">URL da imagem (usada se nenhum arquivo for enviado)</label>
                    <input id="imagemUrl" type="text" name="imagemUrl"
                           th:value="${oferta != null and !oferta.possuiImagemPropria()} ? ${oferta.imagemUrl()} : null"
                           placeholder="https://..."/>
                </div>

                <div class="form-group span-2">
                    <label>Imagem atual</label>
                    <div th:if="${oferta != null and oferta.possuiImagemPropria()}">
                        <div class="img-preview">
                            <img th:src="${oferta.imagemUrl()}" alt="Imagem atual"/>
                        </div>
                        <label class="checkbox-label">
                            <input type="checkbox" name="removerImagem" value="true"/>
                            Remover imagem atual
                        </label>
                    </div>
                    <label for="imagemArquivo">Upload de imagem (substitui URL acima)</label>
                    <input id="imagemArquivo" type="file" name="imagemArquivo" accept="image/*"/>
                </div>

                <div class="form-group">
                    <label for="loja">Loja</label>
                    <select id="loja" name="loja" required>
                        <option th:each="l : ${lojas}" th:value="${l}" th:text="${l}"
                                th:selected="${oferta != null and oferta.loja() == l.name()}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="linkAfiliado">Link de afiliado</label>
                    <input id="linkAfiliado" type="text" name="linkAfiliado"
                           th:value="${oferta?.linkAfiliado()}"
                           placeholder="https://..."
                           required/>
                </div>

                <div class="form-group">
                    <label for="valorOriginal">Preço original (opcional — para promoção)</label>
                    <input id="valorOriginal" type="number" step="0.01" name="valorOriginal"
                           th:value="${oferta?.valorOriginal()}"
                           placeholder="0.00"/>
                </div>

                <div class="form-group">
                    <label for="valor">Valor atual (R$)</label>
                    <input id="valor" type="number" step="0.01" name="valor"
                           th:value="${oferta?.valor()}"
                           placeholder="0.00"
                           required/>
                </div>

                <div class="form-group">
                    <label for="dataExpiracaoDia">Expira — oferta do dia</label>
                    <input id="dataExpiracaoDia" type="datetime-local" name="dataExpiracaoDia"
                           th:value="${oferta != null ? #temporals.format(oferta.dataExpiracaoDia(), 'yyyy-MM-dd''T''HH:mm') : null}"
                           required/>
                </div>

                <div class="form-group">
                    <label for="dataExpiracaoSemana">Expira — oferta da semana</label>
                    <input id="dataExpiracaoSemana" type="datetime-local" name="dataExpiracaoSemana"
                           th:value="${oferta != null ? #temporals.format(oferta.dataExpiracaoSemana(), 'yyyy-MM-dd''T''HH:mm') : null}"
                           required/>
                </div>

            </div>

            <div class="form-actions">
                <button type="submit" class="btn">
                    <i class="material-icons">save</i> Salvar
                </button>
                <a th:href="@{/admin/ofertas}" class="btn btn--ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
