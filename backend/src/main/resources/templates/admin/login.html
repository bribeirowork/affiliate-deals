<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Backoffice</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-card__brand">
            <i class="material-icons">lock</i>
            <h2>Backoffice</h2>
            <p>Grupo de Afiliados</p>
        </div>

        <div class="alert alert--error" th:if="${param.erro}">
            Usuário ou senha inválidos.
        </div>
        <div class="alert alert--info" th:if="${param.logout}">
            Sessão encerrada com sucesso.
        </div>

        <form method="post" th:action="@{/admin/login}" class="login-form">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input id="username" name="username" type="text" placeholder="seu usuário" autofocus required/>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input id="password" name="password" type="password" placeholder="••••••••" required/>
            </div>
            <button type="submit" class="btn">
                <i class="material-icons">login</i> Entrar
            </button>
        </form>
    </div>
</div>
</body>
</html>
