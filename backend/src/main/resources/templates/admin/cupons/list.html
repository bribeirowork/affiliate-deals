<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupons - Backoffice</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: navbar('cupons')}"></div>

<div class="admin-page">
    <div class="page-header">
        <h4>Cupons</h4>
        <a th:href="@{/admin/cupons/novo}" class="btn">
            <i class="material-icons">add</i> Novo cupom
        </a>
    </div>

    <div class="table-wrapper" th:if="${not #lists.isEmpty(cupons)}">
        <table>
            <thead>
            <tr>
                <th>Código</th>
                <th>Loja</th>
                <th>Desconto</th>
                <th>Compra mínima</th>
                <th>Validade</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cupom : ${cupons}">
                <td data-label="Código" th:text="${cupom.codigo()}"></td>
                <td data-label="Loja" th:text="${cupom.loja()}"></td>
                <td data-label="Desconto"
                    th:text="${cupom.tipoDesconto() == 'PERCENTUAL'} ? ${cupom.valorDesconto()} + '%' : 'R$ ' + ${cupom.valorDesconto()}"></td>
                <td data-label="Mínimo"
                    th:text="${cupom.valorMinimoCompra() != null} ? 'R$ ' + ${cupom.valorMinimoCompra()} : '—'"></td>
                <td data-label="Validade"
                    th:text="${#temporals.format(cupom.dataValidade(), 'dd/MM/yy HH:mm')}"></td>
                <td data-label="Status">
                    <span class="status-chip status-chip--ativo"   th:if="${cupom.status() == 'ATIVO'}">ATIVO</span>
                    <span class="status-chip status-chip--inativo"  th:unless="${cupom.status() == 'ATIVO'}">INATIVO</span>
                </td>
                <td data-label="Ações">
                    <div class="action-icons">
                        <a th:href="@{/admin/cupons/{id}/editar(id=${cupom.id()})}" title="Editar">
                            <i class="material-icons">edit</i>
                        </a>
                        <form th:action="@{/admin/cupons/{id}/desabilitar(id=${cupom.id()})}" method="post"
                              th:if="${cupom.status() == 'ATIVO'}">
                            <button type="submit" class="btn-disable" title="Desabilitar">
                                <i class="material-icons">visibility_off</i>
                            </button>
                        </form>
                        <form th:action="@{/admin/cupons/{id}/habilitar(id=${cupom.id()})}" method="post"
                              th:unless="${cupom.status() == 'ATIVO'}">
                            <button type="submit" class="btn-disable" title="Habilitar">
                                <i class="material-icons">visibility</i>
                            </button>
                        </form>
                        <form th:action="@{/admin/cupons/{id}/remover(id=${cupom.id()})}" method="post"
                              onsubmit="return confirm('Remover este cupom?');">
                            <button type="submit" class="btn-delete" title="Remover">
                                <i class="material-icons">delete</i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(cupons)}">
        <i class="material-icons">confirmation_number</i>
        <p>Nenhum cupom cadastrado ainda.</p>
    </div>
</div>

<a th:href="@{/admin/cupons/novo}" class="fab-add" title="Novo cupom">
    <i class="material-icons">add</i>
</a>

</body>
</html>
