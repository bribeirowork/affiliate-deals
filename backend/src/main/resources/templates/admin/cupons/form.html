<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupom - Backoffice</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar('cupons')}"></div>

<div class="container">
    <div class="page-header">
        <h4 th:text="${cupom != null} ? 'Editar cupom' : 'Novo cupom'"></h4>
    </div>

    <div class="card">
        <div class="card-content">
            <form method="post"
                  th:action="${cupom != null} ? @{/admin/cupons/{id}(id=${cupom.id()})} : @{/admin/cupons}">

                <div class="row" style="margin-bottom: 0;">
                    <div class="input-field col s12 m6">
                        <input id="codigo" type="text" name="codigo" th:value="${cupom?.codigo()}" required="required"/>
                        <label for="codigo" class="active">Código</label>
                    </div>

                    <div class="input-field col s12 m6">
                        <select id="loja" name="loja" class="browser-default" required="required">
                            <option th:each="l : ${lojas}" th:value="${l}" th:text="${l}"
                                    th:selected="${cupom != null and cupom.loja() == l.name()}"></option>
                        </select>
                        <label for="loja" class="active">Loja</label>
                    </div>

                    <div class="input-field col s12">
                        <input id="linkOpcional" type="text" name="linkOpcional" th:value="${cupom?.linkOpcional()}"/>
                        <label for="linkOpcional" class="active">Link (opcional)</label>
                    </div>

                    <div class="input-field col s12 m6">
                        <select id="tipoDesconto" name="tipoDesconto" class="browser-default" required="required">
                            <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"
                                    th:selected="${cupom != null and cupom.tipoDesconto() == t.name()}"></option>
                        </select>
                        <label for="tipoDesconto" class="active">Tipo de desconto</label>
                    </div>

                    <div class="input-field col s12 m6">
                        <input id="valorDesconto" type="number" step="0.01" name="valorDesconto" th:value="${cupom?.valorDesconto()}" required="required"/>
                        <label for="valorDesconto" class="active">Valor do desconto</label>
                    </div>

                    <div class="input-field col s12 m6">
                        <input id="valorMinimoCompra" type="number" step="0.01" name="valorMinimoCompra" th:value="${cupom?.valorMinimoCompra()}"/>
                        <label for="valorMinimoCompra" class="active">Valor mínimo de compra (opcional)</label>
                    </div>

                    <div class="input-field col s12 m6">
                        <input id="dataValidade" type="datetime-local" name="dataValidade"
                               th:value="${cupom != null ? #temporals.format(cupom.dataValidade(), 'yyyy-MM-dd''T''HH:mm') : null}" required="required"/>
                        <label for="dataValidade" class="active">Validade</label>
                    </div>
                </div>

                <button class="btn indigo waves-effect waves-light" type="submit">
                    Salvar <i class="material-icons right">save</i>
                </button>
                <a th:href="@{/admin/cupons}" class="btn-flat waves-effect">Cancelar</a>
            </form>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
